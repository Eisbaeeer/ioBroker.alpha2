version: 2
updates:
    - package-ecosystem: github-actions
      directory: '/'
      schedule:
          interval: monthly
          time: '04:00'
          timezone: Europe/Berlin

    - package-ecosystem: npm
      directory: '/'
      schedule:
          interval: monthly
          time: '04:00'
          timezone: Europe/Berlin
      cooldown:
          default-days: 7
      open-pull-requests-limit: 10
      versioning-strategy: increase
